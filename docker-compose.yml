services:
  db:
    image: postgres:16
    container_name: site-pedras-preciosas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: site_pedras_preciosas
    ports:
      - "5436:5432"
    volumes:
      - site-pedras-preciosas-db-data:/var/lib/postgresql/data

  rembg:
    build: ./rembg-service
    container_name: site-pedras-preciosas-rembg
    restart: unless-stopped
    environment:
      REMBG_SERVICE_SECRET: "${REMBG_SERVICE_SECRET:-}"
    ports:
      - "8001:8001"

volumes:
  site-pedras-preciosas-db-data:
